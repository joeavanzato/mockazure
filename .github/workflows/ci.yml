name: Regression and default installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked --group clients
      - run: uv run ruff check .
      - run: uv run python -m tools.check_cloud_coverage --check
      - run: mkdir -p work && uv run python -m pytest tests/unit -q --basetemp=work/ci-unit
      - run: uv run python tools/prepare_tests.py
      - run: docker compose -f compose.test.m6.yaml up -d --wait
      - run: uv run python -m pytest tests/integration -q --basetemp=work/ci-integration
        env:
          MOCKAZURE_TEST_DB_PORT: "55445"
      - if: always()
        run: docker compose -f compose.test.m6.yaml stop
  default-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m tools.verify_default

  mail-content-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/mail-content-manifest.json --output work/mail-content-vendor
      - run: uv run python -m tools.verify_mail_content

  site-drive-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/site-drive-manifest.json --output work/site-drive-vendor
      - run: uv run python -m tools.verify_site_drive

  teams-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/teams-manifest.json --output work/teams-vendor
      - run: uv run python -m tools.verify_teams

  intune-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/intune-manifest.json --output work/intune-clients-vendor
      - run: uv run python -m tools.verify_intune

  activity-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m tools.verify_activity_feed

  method-management-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/method-management-manifest.json --output work/method-management-clients-vendor
      - run: uv run python -m tools.verify_method_management

  authentication-policies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python tools/prepare_clients.py --manifest integrations/method-management-manifest.json --output work/method-management-clients-vendor
      - run: uv run python -m tools.verify_authentication_policies

  collection-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m tools.benchmark_coverage --small


  cloud-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        phase: [A, B, C, D, E, F]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.15.0"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: uv sync --locked --group clients
      - run: uv run python tools/prepare_clients.py --manifest integrations/manifest.json --output work/vendor
      - run: uv run python -m tools.verify_cloud_workflows --phase ${{ matrix.phase }} --ecosystems python powershell dotnet typescript --report work/cloud/${{ matrix.phase }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-${{ matrix.phase }}-qualification
          path: work/cloud/${{ matrix.phase }}.json
          if-no-files-found: warn

  cloud-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked --group clients
      - run: uv run python -m tools.benchmark_cloud_workflows --records 100000 --binary-bytes 268435456 --readers 8 --report work/cloud/scale.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-scale-qualification
          path: work/cloud/scale.json
          if-no-files-found: warn

  cloud-distributions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked --group clients
      - run: uv run python tools/prepare_tests.py
      - run: docker compose -f compose.test.m6.yaml up -d --wait
      - run: uv run python -m tools.build_release --commit "$(git rev-parse HEAD)" --output work/release/candidate
      - run: uv run python -m tools.verify_cloud_distribution --database-container "$(docker compose -f compose.test.m6.yaml ps -q db)"
        env:
          MOCKAZURE_TEST_DB_PORT: "55445"
      - if: always()
        run: docker compose -f compose.test.m6.yaml stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-distribution-qualification
          path: |
            work/release/artifacts.json
            work/release/cloud-distribution.json
            work/release/cloud-probes-*/fixtures/*.xml
          if-no-files-found: warn
