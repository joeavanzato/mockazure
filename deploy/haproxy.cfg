global
    maxconn 2048
defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
frontend https
    bind :8443
    default_backend api
backend api
    server api api:8443 check resolvers docker init-addr libc,none
frontend postgres
    bind :5432
    default_backend db
backend db
    server db db:5432 check resolvers docker init-addr libc,none
