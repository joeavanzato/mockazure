global
    maxconn 2048
defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
frontend https
    bind :8443
    default_backend api
backend api
    server api api:8443 check resolvers docker init-addr libc,none
frontend blob
    bind :8444
    default_backend blob_api
backend blob_api
    server api api:8444 check resolvers docker init-addr libc,none
frontend file
    bind :8445
    default_backend file_api
backend file_api
    server api api:8445 check resolvers docker init-addr libc,none
frontend queue
    bind :8446
    default_backend queue_api
backend queue_api
    server api api:8446 check resolvers docker init-addr libc,none
frontend table
    bind :8447
    default_backend table_api
backend table_api
    server api api:8447 check resolvers docker init-addr libc,none
frontend keyvault
    bind :8448
    default_backend keyvault_api
backend keyvault_api
    server api api:8448 check resolvers docker init-addr libc,none
frontend postgres
    bind :5432
    default_backend db
backend db
    server db db:5432 check resolvers docker init-addr libc,none

frontend logs
    bind :8449
    default_backend logs_api
backend logs_api
    server api api:8449 check resolvers docker init-addr libc,none
