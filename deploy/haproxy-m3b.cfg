global
    maxconn 2048
defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
frontend https
    bind :443
    default_backend api
backend api
    balance roundrobin
    server api2 api2:8443 check resolvers docker init-addr libc,none
    server api api:8443 check resolvers docker init-addr libc,none
frontend postgres
    bind :5432
    default_backend db
backend db
    server db db:5432 check resolvers docker init-addr libc,none

frontend managed_identity
    bind :8080
    default_backend managed_identity
backend managed_identity
    server identity managed-identity:8080 check resolvers docker init-addr libc,none
