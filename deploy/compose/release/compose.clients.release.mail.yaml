name: mockazure-m6-mail-clients
services:
  powershell:
    image: mcr.microsoft.com/powershell@sha256:042240d57ec9e47e511033b92625a8d95875ee5860af3015992c248b58a8be81
    entrypoint: ["pwsh", "-NoLogo", "-NoProfile", "-File"]
    command: ["/project/integrations/powershell/Test-NetworkBoundary.ps1"]
    working_dir: /project
    environment:
      TZ: UTC
      SSL_CERT_FILE: /certs/ca.pem
      PSModulePath: /vendor/modules:/opt/microsoft/powershell/7/Modules
      POWERSHELL_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - ../../../.runtime/m6-mail/instance/ca.pem:/certs/ca.pem:ro
      - ../../../integrations:/project/integrations:ro
      - ../../../work/vendor/modules:/vendor/modules:ro
      - ../../../work/vendor/dependencies:/vendor/dependencies:ro
      - ../../../work/vendor/collectors:/vendor/collectors:ro
      - ../../../work/collector-profiles:/collector-profiles:ro
      - ../../../.runtime/m6-mail/clients/powershell-state:/state
      - ../../../.runtime/m6-mail/clients/powershell-root:/root
      - ../../../.runtime/m6-mail/clients/powershell-tmp:/tmp
    dns: [127.0.0.1]
    networks: [isolated]
  python:
    image: mockazure:m6-mail-python-clients
    pull_policy: never
    entrypoint: ["python"]
    command: ["/project/integrations/python/network_boundary.py"]
    working_dir: /project
    environment:
      TZ: UTC
      SSL_CERT_FILE: /certs/ca.pem
      PYTHONDONTWRITEBYTECODE: "1"
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
    volumes:
      - ../../../.runtime/m6-mail/instance/ca.pem:/certs/ca.pem:ro
      - ../../../integrations:/project/integrations:ro
      - ../../../work/vendor/modules:/vendor/modules:ro
      - ../../../work/vendor/dependencies:/vendor/dependencies:ro
      - ../../../work/vendor/collectors:/vendor/collectors:ro
      - ../../../work/collector-profiles:/collector-profiles:ro
      - ../../../.runtime/m6-mail/clients/python-state:/state
      - ../../../.runtime/m6-mail/clients/python-root:/root
      - ../../../.runtime/m6-mail/clients/python-tmp:/tmp
    dns: [127.0.0.1]
    networks: [isolated]
networks:
  isolated:
    name: mockazure-m6-mail-clients-isolated
    external: true
